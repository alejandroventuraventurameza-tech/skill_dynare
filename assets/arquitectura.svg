<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Arquitectura de MacroBuilt</text>

  <!-- auto-reparación curva -->
  <path d="M 698 90 C 698 58, 498 58, 498 90" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="598" y="52" text-anchor="middle" font-size="12.5" fill="#6366f1" font-weight="600">↺ auto-reparación si el verificador halla errores</text>

  <!-- flechas pipeline -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)">
    <line x1="186" y1="122" x2="208" y2="122"/>
    <line x1="386" y1="122" x2="408" y2="122"/>
    <line x1="586" y1="122" x2="608" y2="122"/>
    <line x1="786" y1="122" x2="808" y2="122"/>
    <line x1="498" y1="228" x2="498" y2="156"/>
    <line x1="698" y1="228" x2="698" y2="156"/>
  </g>

  <!-- cajas pipeline -->
  <g>
    <rect x="10"  y="90" width="176" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="98"  y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Entrada</text>
    <text x="98"  y="136" text-anchor="middle" font-size="12" fill="#64748b">ecuaciones / foto</text>

    <rect x="210" y="90" width="176" height="64" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="298" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">OCR</text>
    <text x="298" y="136" text-anchor="middle" font-size="12" fill="#475569">PaddleOCR · PP-OCRv4</text>

    <rect x="410" y="90" width="176" height="64" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="498" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Traductor (IA)</text>
    <text x="498" y="136" text-anchor="middle" font-size="12" fill="#475569">DeepSeek · API</text>

    <rect x="610" y="90" width="176" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="698" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Verificador</text>
    <text x="698" y="136" text-anchor="middle" font-size="12" fill="#475569">estático · determinista</text>

    <rect x="810" y="90" width="180" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="900" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">.mod verificado</text>
    <text x="900" y="136" text-anchor="middle" font-size="12" fill="#64748b">+ explicación</text>
  </g>

  <!-- alimentadores -->
  <rect x="404" y="230" width="188" height="56" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="498" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Base de conocimiento</text>
  <text x="498" y="271" text-anchor="middle" font-size="11.5" fill="#64748b">manual de Dynare + ejemplos</text>

  <rect x="604" y="230" width="188" height="56" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="698" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Bootcamp</text>
  <text x="698" y="271" text-anchor="middle" font-size="11.5" fill="#64748b">usa el verificador (auto-grader)</text>

  <!-- footer -->
  <rect x="200" y="330" width="600" height="42" rx="21" fill="#4f46e5"/>
  <text x="500" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Desplegado en Hugging Face Spaces · Gradio · open source · BYOK (tu API key)</text>
</svg>
