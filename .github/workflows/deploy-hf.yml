name: Deploy to Hugging Face Space

# Despliega el repo al Space de Hugging Face en cada push (y manualmente).
on:
  push:
    branches: [main, first_branch]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Subir una instantánea limpia al Space de Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE_NAME" ]; then
            echo "Faltan HF_TOKEN (secret) y/o HF_USERNAME / HF_SPACE_NAME (variables)."
            exit 1
          fi
          # Excluir del Space los archivos que no debe servir (binarios pesados / PII):
          # cualquier PDF y los datos crudos de la encuesta.
          find . -maxdepth 6 -name '*.pdf' -delete || true
          rm -f docs/research/data/*.csv docs/research/data/*.xlsx docs/research/data/*.xls || true
          # No enviar metadatos de git ni el propio CI al Space.
          rm -rf .git .github

          pip install "huggingface_hub>=0.25"

          # upload_folder maneja binarios vía Xet/LFS de forma transparente (HF ya no
          # acepta binarios en un git push normal). delete_patterns="*" replica la
          # "instantánea limpia": borra del Space lo que ya no exista localmente.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = f"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}"
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy snapshot desde GitHub",
              delete_patterns="*",
          )
          print(f"Desplegado a https://huggingface.co/spaces/{repo_id}")
          PY
